[package]
name = "remote-screen"
version = "0.2.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/Saco93/remote-screen"
default-run = "remote-screen"
description = "Native LG C9 desktop mirroring with HEVC and Rust"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
ctrlc = { version = "3", features = ["termination"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zbus = "5"
futures-lite = "2"
async-io = "2"
gstreamer = { version = "0.25", features = ["v1_24"] }
gstreamer-video = { version = "0.25", features = ["v1_24"] }
gio = "0.22"
libpulse-binding = "2"
libc = "0.2"

[profile.release]
lto = "thin"
